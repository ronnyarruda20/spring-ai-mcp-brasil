name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Testes
        run: mvn -B verify

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build da imagem
        run: docker build -t spring-ai-mcp-brasil .
      - name: Servidor sobe e responde ao initialize
        run: |
          docker run -d --name mcp -p 8080:8080 spring-ai-mcp-brasil
          for i in $(seq 1 30); do curl -s localhost:8080/mcp -o /dev/null && break; sleep 2; done
          curl -sf -X POST localhost:8080/mcp \
            -H 'Content-Type: application/json' -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            | tee /dev/stderr | grep -q '"name":"mcp-brasil"'
